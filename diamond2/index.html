.header {
    background: #70c9ec;

.video-box video {

.subtitle {
    text-align: center;
    font-size: 28px;
    margin-top: 35px;

.stars {
    text-align: center;
    font-size: 43px;
    margin: 22px 0 40px;
}

.install {
    display: block;
    width: 100%;
    padding: 22px 10px;
    border-radius: 60px;
    background: #08e879;
    color: white;
    text-align: center;
    text-decoration: none;
    font-size: 36px;
    font-weight: 700;
}

.install:active {
    transform: scale(0.98);
}

@media (max-width: 600px) {
    .header {
        padding: 35px 8px;
    }

    .header h1 {
        font-size: 38px;
    }

    .video-box {
        margin-top: 38px;

        width: 65px;
height: 65px;
